name: Fix lineage validator
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-lineage-validator.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align validator with canonical lineage names
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate.mjs')
          s=p.read_text()
          old1="if(!lineage?.compound||lineage.compound.formula!=='DEUS + LEGADO') errors.push('Regra de Legado Composto ausente/incorreta.');"
          new1="if(!lineage?.compound||lineage.compound.formula!=='LEGADO + LEGADO') errors.push('Regra de Legado Composto ausente/incorreta.');"
          old2="if(!lineage?.direct||lineage.direct.formula!=='LEGADO + LEGADO') errors.push('Regra de Legado Direto ausente/incorreta.');"
          new2="if(!lineage?.direct||lineage.direct.formula!=='DEUS + LEGADO') errors.push('Regra de Legado Direto ausente/incorreta.');"
          if s.count(old1)!=1 or s.count(old2)!=1: raise SystemExit('lineage validator anchors do not match')
          p.write_text(s.replace(old1,new1).replace(old2,new2))
          PY
      - name: Validate canonical data
        run: node scripts/validate.mjs
      - name: Commit validator fix
        run: |
          git config user.name 'Legio Fulminata'
          git config user.email '131549072+stsedd@users.noreply.github.com'
          git add scripts/validate.mjs
          git diff --cached --check
          git commit -m 'Align lineage validator with canonical semantics'
          git push