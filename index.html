<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duodécima Core</title>
<style>body{margin:0;background:#030303;color:#f5eff1;font:15px/1.6 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:48px 20px}h1{font:700 44px/1.05 Georgia,serif;margin:.2em 0}.ey{color:#ef3046;letter-spacing:.16em;font-size:11px;font-weight:800}.card{border:1px solid #4a2930;background:#0a0809;border-radius:14px;padding:18px;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:#070707;border:1px solid #33282b;border-radius:10px;padding:14px}.stat b{display:block;font:700 28px Georgia,serif;color:#d8b16d}.ok{color:#7bd58e}.err{color:#ff6674}</style></head>
<body><main><div class="ey">LEGIO XII FULMINATA · DATA LAYER</div><h1>Duodécima Core</h1><p>Fonte compartilhada de regras para Guia, Ficha e Scutum Magistri.</p><div id="status" class="card">Carregando manifesto…</div><div id="counts" class="stats"></div><div class="card"><b>Este não é o Scutum Magistri.</b><p>O Core não guarda encontros, HP de monstros ou notas do Mestre. Ele publica somente as regras compartilhadas.</p></div></main>
<script>fetch('./manifest.json',{cache:'no-store'}).then(r=>r.json()).then(m=>{document.querySelector('#status').innerHTML='<span class="ok">● ONLINE</span><br>Conteúdo '+m.contentVersion+' · schema '+m.schemaVersion;document.querySelector('#counts').innerHTML=Object.entries(m.counts).map(([k,v])=>'<div class="stat"><span>'+k+'</span><b>'+v+'</b></div>').join('')}).catch(e=>document.querySelector('#status').innerHTML='<span class="err">● ERRO</span><br>'+e.message)</script></body></html>
